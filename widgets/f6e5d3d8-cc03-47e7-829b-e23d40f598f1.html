<!doctype html><html lang="nl"><head><meta charset="utf-8"><base href="../"><link rel="stylesheet" href="fonts.css"><script src="data.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:8px;background:transparent;font-family:Raleway,sans-serif}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;height:calc(100vh - 16px)}button{border:2px solid #534d2d;border-radius:5px;padding:0;overflow:hidden;background:#f1d09e;cursor:pointer;transition:transform .25s}button:hover{transform:scale(1.03)}img{width:100%;height:100%;object-fit:cover;display:block}.matched{border-color:#64af68}</style></head><body><div id="cards"></div><script>
const c=ESCAPE_DATA.BaseWidgets.find(w=>w.script.scriptId==='@genially/find-the-pair').script.config;let first=null,busy=false,done=0;const cards=c.itemList.flatMap((v,i)=>[{pair:i,src:v.image.source},{pair:i,src:v.imagePair.source}]).sort(()=>Math.random()-.5);const root=document.getElementById('cards');cards.forEach((item,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Kaart '+(i+1));b.innerHTML='<img alt="Omgedraaide kaart" src="'+c.coverImage.source+'">';b.onclick=()=>{if(busy||b.dataset.open)return;b.dataset.open='yes';b.firstChild.src=item.src;if(!first){first={item,b};return;}if(first.item.pair===item.pair){b.classList.add('matched');first.b.classList.add('matched');done++;first=null;if(done===c.itemList.length)parent.postMessage({escapeWidget:true,widgetId:window.WIDGET_ID,type:'action',action:c.onEndAction},'*');}else{busy=true;const prev=first;first=null;setTimeout(()=>{b.firstChild.src=prev.b.firstChild.src=c.coverImage.source;delete b.dataset.open;delete prev.b.dataset.open;busy=false;},1000);}};root.append(b);});
</script></body></html>
