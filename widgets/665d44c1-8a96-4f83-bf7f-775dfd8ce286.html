          <circle id="hm-head"      cx="140" cy="63"  r="17"                                              stroke="var(--hangman-color)" stroke-width="3" fill="none" class="hangman-part"/>
          <line   id="hm-body"      x1="140" y1="80"  x2="140" y2="142"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>

          <line   id="hm-leg-l"     x1="140" y1="142" x2="112" y2="182"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>
          <line   id="hm-leg-r"     x1="140" y1="142" x2="168" y2="182"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>
          <line   id="hm-forearm-l" x1="108" y1="120" x2="94"  y2="140"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>
          <line   id="hm-forearm-r" x1="172" y1="120" x2="186" y2="140"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>
          <line   id="hm-foot-l"    x1="112" y1="182" x2="96"  y2="204"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>
          <line   id="hm-foot-r"    x1="168" y1="182" x2="184" y2="204"                                  stroke="var(--hangman-color)" stroke-width="3" stroke-linecap="round" class="hangman-part"/>

    <script>
      const KEYBOARD_LAYOUTS = {
        standard: ['Q','W','E','R','T','Y','U','I','O','P','A','S','D','F','G','H','J','K','L','Z','X','C','V','B','N','M'],
        es:       ['Q','W','E','R','T','Y','U','I','O','P','A','S','D','F','G','H','J','K','L','Ñ','Z','X','C','V','B','N','M'],
        pt:       ['Q','W','E','R','T','Y','U','I','O','P','A','S','D','F','G','H','J','K','L','Ç','Z','X','C','V','B','N','M','Á','Â','Ã','À','É','Ê','Í','Ó','Ô','Õ','Ú'],
        de:       ['Q','W','E','R','T','Z','U','I','O','P','Ü','A','S','D','F','G','H','J','K','L','Ö','Ä','Y','X','C','V','B','N','M','ß'],
        fr:       ['A','Z','E','R','T','Y','U','I','O','P','Q','S','D','F','G','H','J','K','L','M','W','X','C','V','B','N','À','Â','Æ','Ç','É','È','Ê','Ë','Î','Ï','Ô','Œ','Ù','Û','Ü'],
        he:       ['ק','ר','א','ט','ו','ן','ם','פ','ש','ד','ג','כ','ע','י','ח','ל','ך','ף','ז','ס','ב','ה','נ','מ','צ','ת','ץ'],
      };

      function render(config) {
        const hangmanApp = document.getElementById('hangman-app');
        const wordDisplay = document.getElementById('word-display');
        const mistakeCounter = document.getElementById('mistake-counter');
        const keyboardDiv = document.getElementById('keyboard');
        const contentWrapper = document.getElementById('content-wrapper');
        const keyboardWrapper = document.getElementById('keyboard-wrapper');

        // Reset application state and content on re-render
        wordDisplay.innerHTML = '';
        keyboardDiv.innerHTML = '';
        hangmanApp.classList.remove('flex-row', 'md:flex-row'); // Clean up previous layout classes

        // Apply custom colors
        document.documentElement.style.setProperty('--text-color', config.textColor);
        document.documentElement.style.setProperty(
          '--keyboard-btn-bg',
          config.keyboardButtonBgColor,
        );
        document.documentElement.style.setProperty(
          '--keyboard-btn-text',
          config.keyboardButtonTextColor,
        );
        document.documentElement.style.setProperty(
          '--correct-guess-color',
          config.correctGuessColor,
        );
        document.documentElement.style.setProperty(
          '--incorrect-guess-color',
          config.incorrectGuessColor,
        );
        document.documentElement.style.setProperty(
          '--hangman-color',
          config.hangmanColor || '#333333',
        );

        const hangmanDrawing = document.getElementById('hangman-drawing');
        hangmanDrawing.classList.remove('size-large', 'size-medium', 'size-small');
        hangmanDrawing.classList.add('size-' + (config.hangmanSize || 'large'));

        // Apply font family and button border radius
        document.documentElement.style.setProperty(
          '--button-border-radius',
          config.buttonBorderRadius,
        );

        // Set layout orientation and keyboard position
        const position = config.keyboardPosition || 'bottom';
        contentWrapper.style.order = '';
        keyboardWrapper.style.order = '';

        if (config.layoutOrientation === 'horizontal') {
          hangmanApp.classList.add('flex-col', 'md:flex-row');
          contentWrapper.classList.add('md:w-1/2');
          contentWrapper.classList.remove('justify-end');
          contentWrapper.classList.add('justify-center');
          keyboardWrapper.classList.add('md:w-1/2', 'md:max-h-full');
          keyboardDiv.classList.add('md:max-h-full', 'md:overflow-y-auto');
          if (position === 'left') {
            keyboardWrapper.style.order = '1';
            contentWrapper.style.order = '2';
          }
        } else {
          hangmanApp.classList.add('flex-col');
          contentWrapper.classList.remove('md:w-1/2');
          contentWrapper.classList.remove('justify-center');
          contentWrapper.classList.add('justify-end');
          keyboardWrapper.classList.remove('md:w-1/2', 'md:max-h-full');
          keyboardDiv.classList.remove('md:max-h-full', 'md:overflow-y-auto');
          if (position === 'top') {
            keyboardWrapper.style.order = '1';
            contentWrapper.style.order = '2';
          }
        }

        // Game State
        let wordToGuess = '';
        let guessedLetters = new Set();
        let incorrectGuesses = 0;
        const maxMistakes = Number.parseInt(config.maxMistakes, 10) || 7;
        let gameWon = false;
        let gameLost = false;

        // --- Game Initialization ---
        function initializeGame() {
          const lang = config.keyboardLanguage || 'standard';
          const rawWord = (config.word || '').trim();
          const configuredWord = lang === 'he' ? rawWord : rawWord.toUpperCase();

          if (configuredWord.replace(/ /g, '').length === 0) {
            disableKeyboard();
            return;
          }

          wordToGuess = configuredWord;
          guessedLetters = new Set();
          incorrectGuesses = 0;
          gameWon = false;
          gameLost = false;
          updateUI();
        }

        // --- UI Update Function ---
        const HANGMAN_PARTS = ['hm-head','hm-body','hm-arm-l','hm-arm-r','hm-leg-l','hm-leg-r','hm-forearm-l','hm-forearm-r','hm-foot-l','hm-foot-r'];

        function updateUI() {
          // Update hangman drawing — proportional to maxMistakes so it's always
          // complete when the player loses, regardless of the configured attempts.
          const partsToShow = Math.round((incorrectGuesses / maxMistakes) * HANGMAN_PARTS.length);
          HANGMAN_PARTS.forEach((id, i) => {
            document.getElementById(id).classList.toggle('visible', i < partsToShow);
          });

          // Update word display
          wordDisplay.innerHTML = wordToGuess
            .split('')
            .map(letter => {
              if (letter === ' ') {
                return `<span class="inline-block mx-1">&nbsp;</span>`;
              }
              return `<span class="inline-block mx-1">${guessedLetters.has(letter) ? letter : config.letterPlaceholder || '_'}</span>`;
            })
            .join('');

          // Update mistake counter
          if (config.showMistakesCounter) {
            mistakeCounter.textContent = `${config.mistakesLabelPrefix || ''}${incorrectGuesses} / ${maxMistakes}${config.mistakesLabelSuffix || ''}`;
          } else {
            mistakeCounter.textContent = '';
          }

          // Update keyboard buttons
          const buttons = keyboardDiv.querySelectorAll('.keyboard-button');
          for (const button of buttons) {
            const letter = button.dataset.letter;
            if (guessedLetters.has(letter)) {
              if (wordToGuess.includes(letter)) {
                button.classList.add('button-correct');
              } else {
                button.classList.add('button-incorrect');
              }
            } else if (gameWon || gameLost) {
              button.classList.add('button-disabled');
            } else {
              button.classList.remove(
                'button-correct',
                'button-incorrect',
                'button-disabled',
              );
            }
          }

          // Check for win/lose conditions
          const currentWordDisplay = wordToGuess
            .split('')
            .map(letter => {
              if (letter === ' ') {
                return ' ';
              }
              return guessedLetters.has(letter) ? letter : '_';
            })
            .join('');
          if (currentWordDisplay === wordToGuess && !gameWon && !gameLost) {
            gameWon = true;
            disableKeyboard();
            if (config.winAction) {
              genially.runAction(config.winAction);
            }
          } else if (incorrectGuesses >= maxMistakes && !gameLost && !gameWon) {
            gameLost = true;
            disableKeyboard();
            if (config.loseAction) {
              genially.runAction(config.loseAction);
            }
          }
        }

        // --- Keyboard Handling ---
        function handleGuess(letter) {
          if (gameWon || gameLost || guessedLetters.has(letter)) {
            return;
          }

          guessedLetters.add(letter);

          if (!wordToGuess.includes(letter)) {
            incorrectGuesses++;
            if (config.mistakeActions) {
              genially.runAction(config.mistakeActions);
            }
          }
          updateUI();
        }

        function disableKeyboard() {
          const buttons = keyboardDiv.querySelectorAll('.keyboard-button');
          for (const button of buttons) {
            button.classList.add('button-disabled');
            button.style.pointerEvents = 'none'; // Ensure no clicks
          }
        }

        // --- Build Keyboard ---
        function buildKeyboard() {
          keyboardDiv.innerHTML = '';
          const lang = config.keyboardLanguage || 'standard';
          const letters = KEYBOARD_LAYOUTS[lang] || KEYBOARD_LAYOUTS.standard;
          for (const letter of letters) {
            const button = document.createElement('button');
            button.classList.add('keyboard-button');
            button.textContent = letter;
            button.dataset.letter = letter;
            button.addEventListener('click', () => handleGuess(letter));
            keyboardDiv.appendChild(button);
          }
        }

        // Initial setup
        buildKeyboard();
        initializeGame();
      }

      // Auto-executing function to connect and render
      (async () => {
        const initialConfig = await genially.connect();

        genially.on('config', newConfig => {
          render(newConfig);
        });

        render(initialConfig);
      })();
    </script>
  </body>
</html>
