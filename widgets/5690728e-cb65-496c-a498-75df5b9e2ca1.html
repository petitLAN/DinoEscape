  <body>
    <div
      id="app"
      class="relative w-full h-full flex flex-col items-center justify-center space-y-6 w-full p-8 transition-all duration-300 ease-in-out"
    >
      <p id="prompt-message" class="text-center font-semibold text-lg"></p>
      <input
        type="text"
        id="access-code-input"
        class="max-w-sm w-full p-4 rounded-lg border-2 focus:outline-none focus:ring-current transition-all duration-300 ease-in-out text-center"
        aria-label="Access Code Input"
      />
      <button
        type="button"
        id="unlock-button"
        class="max-w-sm w-full p-4 rounded-lg font-bold text-white uppercase tracking-wider transition-all duration-300 ease-in-out transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-current"
        aria-label="Unlock Content"
      ></button>
    </div>

    <script>
      function render(config) {
        const app = document.getElementById('app');
        const promptMessageElem = document.getElementById('prompt-message');
        const accessCodeInput = document.getElementById('access-code-input');
        const unlockButton = document.getElementById('unlock-button');

        // Apply configurable styles
        app.style.backgroundColor = config.widgetBackgroundColor || '#00000000';

        promptMessageElem.textContent = config.promptMessage || 'Enter the access code:';
        promptMessageElem.style.color = config.textColor || '#000000';
        promptMessageElem.style.fontSize = config.fontSize || '1.5rem';
        promptMessageElem.style.fontFamily =
          (config.fontFamily?.name || config.fontFamily) || 'Source Sans Pro, sans-serif';

        accessCodeInput.style.backgroundColor = config.inputBackgroundColor || '#dde6ec';
        accessCodeInput.style.color = config.textColor || '#000000';
        accessCodeInput.style.borderRadius = config.inputBorderRadius || '8px';
        accessCodeInput.style.fontFamily =
          (config.fontFamily?.name || config.fontFamily) || 'Source Sans Pro, sans-serif';
        accessCodeInput.style.fontSize = config.fontSize || '1.2rem';
        accessCodeInput.placeholder = config.inputPlaceholder || 'Enter code'; // Use new config for placeholder
        accessCodeInput.style.borderColor = config.inputBackgroundColor;
        accessCodeInput.style.setProperty(
          '--dynamic-ring-color',
          config.buttonBackgroundColor || '#6c29ff',
        );

        unlockButton.textContent = config.buttonLabel || 'Unlock';
        unlockButton.style.backgroundColor = config.buttonBackgroundColor || '#6c29ff';
        unlockButton.style.color = config.buttonTextColor || '#ffffff';
        unlockButton.style.borderRadius = config.buttonBorderRadius || '8px';
        unlockButton.style.fontFamily =
          (config.fontFamily?.name || config.fontFamily) || 'Source Sans Pro, sans-serif';
        unlockButton.style.fontSize = config.fontSize || '1.2rem';
        unlockButton.style.setProperty(
          '--dynamic-ring-color',
          config.buttonBackgroundColor || '#6c29ff',
        );

        // Clear animations
        accessCodeInput.classList.remove('shake-animation');

        // Event listener for unlock button
        unlockButton.onclick = () => {
          const enteredCode = accessCodeInput.value.trim();
          const correctCode = config.correctAccessCode;

          // Reset elements for new animation cycle
          accessCodeInput.classList.remove('shake-animation');
          void accessCodeInput.offsetWidth; // Trigger reflow to restart animation

          if (enteredCode === correctCode) {
            accessCodeInput.value = ''; // Clear input on success
            if (config.onCorrectCodeAction) {
              genially.runAction(config.onCorrectCodeAction);
            }
          } else {
            // Add a shake animation for incorrect input
            accessCodeInput.classList.add('shake-animation');
            if (config.onIncorrectCodeAction) {
              genially.runAction(config.onIncorrectCodeAction);
            }
          }
        };
      }

      // Auto-executing function to connect to Genially
      (async () => {
        const initialConfig = await genially.connect();

        genially.on('config', newConfig => {
          render(newConfig);
        });

        render(initialConfig);
      })();
    </script>
  </body>
