    <style>
      :root {
        /* Global Styles */
        --font-family-fontFamily: "Source Sans Pro", sans-serif;

        /* Global Colors */
        --primary-bg: #0f172a;
        --text-color: #f8fafc;

        /* Tile Styling (Configurable) */
        --tile-bg: #1e293b;
        --tile-text: #ffffff;
        --tile-border: #475569;
        --tile-border-active: #3b82f6;
        --tile-border-width: 2px;
        --tile-radius: 4px;

        /* Game Logic Colors (Configurable) */
        --correct-color: #22c55e;
        --present-color: #eab308;
        --absent-color: #64748b;

        /* Keyboard & UI derived defaults */
        --key-bg: rgba(255, 255, 255, 0.1);
        --key-text: #f8fafc;
      }

      body {
        background-color: var(--primary-bg);
        color: var(--text-color);
        font-family: var(--font-family-fontFamily); /* Use font variable */
        overflow: hidden;
        touch-action: manipulation;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Keyboard Button Styles */
      .glass-btn {
        background: var(--key-bg);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--key-text);
        transition: all 0.15s ease-out;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .glass-btn:active {
        transform: scale(0.95);
      }

      /* Tile 3D Structure */
      .tile {
        perspective: 1000px;
        transform-style: preserve-3d;
      }

      .tile-inner {
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        position: relative;
      }

      .tile-front,
      .tile-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        box-sizing: border-box;

        /* Applied Configurable Styles */
        border-width: var(--tile-border-width);
        border-radius: var(--tile-radius);
      }

      .tile-front {
        background-color: var(--tile-bg);
        border-color: var(--tile-border);
        color: var(--tile-text);
        transition: border-color 0.2s ease;
      }

      /* Active State for Current Input */
      .tile.active .tile-front {
        border-color: var(--tile-border-active);
        box-shadow: 0 0 0 1px var(--tile-border-active);
      }

      .tile-back {
        transform: rotateX(180deg);
        border-color: transparent;
        color: white;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      /* Animations */
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      .pop .tile-inner {
        animation: pop 0.1s ease-in-out forwards;
      }

      .flip .tile-inner {
        transform: rotateX(180deg);
      }

      /* Error Animation (Shake) */
      @keyframes shake {
        10%,
        90% {
          transform: translateX(-1px);
        }
        20%,
        80% {
          transform: translateX(2px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-4px);
        }
        40%,
        60% {
          transform: translateX(4px);
        }
      }
      .shake {
        animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      }

      /* Keyboard States */
      .key.correct {
        background-color: var(--correct-color);
        color: white;
        border-color: transparent;
      }
      .key.present {
        background-color: var(--present-color);
        color: white;
        border-color: transparent;
      }
      .key.absent {
        background-color: var(--absent-color);
        color: white;
        border-color: transparent;
        opacity: 0.7;
      }

      /* Tile Result Colors */
      .tile.correct .tile-back {
        background-color: var(--correct-color);
        border-color: var(--correct-color);
      }
      .tile.present .tile-back {
        background-color: var(--present-color);
        border-color: var(--present-color);
      }
      .tile.absent .tile-back {
        background-color: var(--absent-color);
        border-color: var(--absent-color);
      }

      /* Smooth Layout */
      #content-wrapper,
      #keyboard-container,
      #board-container {
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);

    <script>
      const safeSetTimeout = window.setTimeout.bind(window);

      // --- State Management ---
      const state = {
        config: {},
        targetWord: 'GLASS',
        wordLength: 5,
        maxAttempts: 6,
        currentAttempt: 0,
        currentTile: 0,
        guesses: [],
        cellStates: [],
        isGameOver: false,
        isAnimating: false,
        keyStatus: {},
        isMobile: false,
      };

      // --- Mobile Detection ---
      function detectMobile() {
        return (
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent,
          ) ||
          (navigator.maxTouchPoints && navigator.maxTouchPoints > 2)
        );
      }

      // --- DOM Elements ---
      const els = {
        layout: document.getElementById('content-wrapper'),
        boardContainer: document.getElementById('board-container'),
        board: document.getElementById('game-board'),
        keyboard: document.getElementById('virtual-keyboard'),
        keyboardContainer: document.getElementById('keyboard-container'),
        title: document.getElementById('game-title'),
      };

      // --- Configuration & Theming ---
      function updateThemeFromConfig(config) {
        const root = document.documentElement.style;

        // Global
        root.setProperty('--primary-bg', config.primaryBgColor || '#0f172a');

        // Tiles
        root.setProperty('--tile-bg', config.boxBgColor || '#1e293b');
        root.setProperty('--tile-text', config.boxTextColor || '#ffffff');
        root.setProperty('--tile-border', config.boxBorderColor || '#475569');
        root.setProperty(
          '--tile-border-active',
          config.activeBoxBorderColor || '#3b82f6',
        );

        const borderWidth =
          config.boxBorderWidth !== undefined ? config.boxBorderWidth : 2;
        root.setProperty('--tile-border-width', `${borderWidth}px`);

        const radius = config.boxCornerRadius !== undefined ? config.boxCornerRadius : 4;
        root.setProperty('--tile-radius', `${radius}px`);

        // Game Status Colors
        root.setProperty('--correct-color', config.correctColor || '#22c55e');
        root.setProperty('--present-color', config.presentColor || '#eab308');
        root.setProperty('--absent-color', config.absentColor || '#64748b');

        // Title & Keyboard Colors
        root.setProperty('--text-color', config.titleTextColor || '#f8fafc');
        root.setProperty('--key-text', config.keyTextColor || '#f8fafc');
        root.setProperty('--key-bg', config.keyBgColor || '#1e293b');

        // Font
        loadFont(config.gameFont, '--font-family-fontFamily');
      }

      function loadFont(fontConfig, variableName) {
        if (!fontConfig || !fontConfig.name) return;

        if (fontConfig.url) {
          const linkId = `font-${fontConfig.name.replace(/\s+/g, '-').toLowerCase()}`;
          if (!document.getElementById(linkId)) {
            const link = document.createElement('link');
            link.id = linkId;
            link.href = fontConfig.url;
            link.rel = 'stylesheet';
            document.head.appendChild(link);
          }
        }

        document.documentElement.style.setProperty(
          variableName,
          `'${fontConfig.name}', 'Source Sans Pro', sans-serif`,
        );
      }

      // --- Layout Management ---
      function updateLayout(location) {
        const wrapper = els.layout;
        const kbContainer = els.keyboardContainer;

        // Reset to base state
        // Keep: flex, gap-2, md:gap-4, items-center, justify-center, max-w-7xl, mx-auto, w-full, h-full
        wrapper.className =
          'flex gap-2 md:gap-4 items-center justify-center mx-auto w-full h-full';

        // Reset KB Container
        // Keep: flex, flex-col, justify-center, items-center, z-40, shrink-0
        kbContainer.className = 'flex flex-col justify-center items-center z-40 shrink-0';
        kbContainer.style.width = '';
        kbContainer.style.maxWidth = '';

        if (location === 'left') {
          wrapper.classList.add('flex-row');
          kbContainer.classList.add('order-first', 'h-full', 'px-2');
          kbContainer.style.width = 'min(400px, 45%)';
        } else if (location === 'right') {
          wrapper.classList.add('flex-row');
          kbContainer.classList.add('order-last', 'h-full', 'px-2');
          kbContainer.style.width = 'min(400px, 45%)';
        } else {
          // Bottom (Default)
          wrapper.classList.add('flex-col');
          kbContainer.classList.add('w-full', 'pb-2', 'md:pb-4');
          kbContainer.style.maxWidth = '600px';
        }

        // Re-calculate board size after layout change
        safeSetTimeout(resizeBoard, 50);
      }

      // --- Game Initialization ---
      function initGame(config) {
        // Validation and setup
        const rawWord = config.targetWord || 'GENIALLY';
        let safeWord = rawWord.replace(/[^a-zA-ZñÑ]/g, '').toUpperCase();

        // Dynamic Length Validation (3 to 10 letters)
        if (safeWord.length < 3 || safeWord.length > 10) {
          safeWord = 'GENIALLY';
        }

        state.targetWord = safeWord;
        state.wordLength = safeWord.length;

        // Configure Rows (Attempts)
        let rows = Number.parseInt(config.maxAttempts);
        if (isNaN(rows) || rows < 1) rows = 6;
        if (rows > 12) rows = 12; // Safety cap
        state.maxAttempts = rows;

        // Reset State
        state.isGameOver = false;
        state.currentAttempt = 0;
        state.currentTile = 0;
        state.isAnimating = false;
        state.keyStatus = {};

        // Initialize Guesses and Cell States
        state.guesses = Array(rows)
          .fill(null)
          .map(() => Array(state.wordLength).fill(''));
        state.cellStates = Array(rows)
          .fill(null)
          .map(() => Array(state.wordLength).fill(null));

        renderBoard(rows, state.wordLength);
        renderKeyboard();
        updateActiveTileHighlight();

        // Layout Update
        updateLayout('bottom');

        // Handle keyboard mode
        updateKeyboardMode(config.useNativeKeyboard);

        resizeBoard();
      }

      function updateKeyboardMode(useNative) {
        const keyboardContainer = els.keyboardContainer;
        const gameContainer = document.getElementById('layout-wrapper');

        // Remove existing hidden input if any
        const existingInput = document.getElementById('hidden-keyboard-input');
        if (existingInput) {
          existingInput.remove();
        }

        if (useNative) {
          // Hide virtual keyboard
          keyboardContainer.style.display = 'none';

          // Detect mobile
          state.isMobile = detectMobile();

          if (state.isMobile) {
            // Create hidden input for mobile native keyboard
            const hiddenInput = document.createElement('input');
            hiddenInput.id = 'hidden-keyboard-input';
            hiddenInput.type = 'text';
            hiddenInput.autocomplete = 'off';
            hiddenInput.autocapitalize = 'characters';
            hiddenInput.autocorrect = 'off';
            hiddenInput.spellcheck = false;
            hiddenInput.setAttribute('inputmode', 'text');

            // Style to be invisible but still focusable
            Object.assign(hiddenInput.style, {
              position: 'absolute',
              top: '50%',
              left: '50%',
              opacity: '0',
              width: '1px',
              height: '1px',
              border: 'none',
              outline: 'none',
              padding: '0',
              margin: '0',
              pointerEvents: 'none',
              caretColor: 'transparent',
            });

            // Handle input events from native keyboard
            hiddenInput.addEventListener('input', e => {
              const value = e.target.value;
              if (value) {
                const lastChar = value.slice(-1).toUpperCase();
                if (/^[A-ZÑ]$/.test(lastChar)) {
                  handleInput(lastChar);
                }
                // Clear input after processing
                hiddenInput.value = '';
              }
            });

            // Handle special keys (Enter, Backspace)
            hiddenInput.addEventListener('keydown', e => {
              if (e.key === 'Enter') {
                e.preventDefault();
                handleInput('ENTER');
              } else if (e.key === 'Backspace') {
                e.preventDefault();
                handleInput('BACKSPACE');
              }
            });

            // Prevent blur on mobile to keep keyboard open
            hiddenInput.addEventListener('blur', () => {
              // Don't auto-refocus if game is over
              if (!state.isGameOver && state.config.useNativeKeyboard && state.isMobile) {
                // Small delay to allow intentional blur
                setTimeout(() => {
                  if (document.activeElement !== hiddenInput && !state.isGameOver) {
                    // Don't force refocus, let user tap to focus again
                  }
                }, 100);
              }
            });

            gameContainer.appendChild(hiddenInput);

            // Focus on tap/click on game area
            gameContainer.addEventListener('click', focusHiddenInput);
            gameContainer.addEventListener('touchend', focusHiddenInput);
          } else {
            // Desktop with native keyboard - just make focusable
            gameContainer.setAttribute('tabindex', '0');
            gameContainer.style.outline = 'none';
          }
        } else {
          // Show virtual keyboard
          keyboardContainer.style.display = '';

          // Remove focusable attribute and listeners
          gameContainer.removeAttribute('tabindex');
          gameContainer.removeEventListener('click', focusHiddenInput);
          gameContainer.removeEventListener('touchend', focusHiddenInput);
        }
      }

      function focusHiddenInput(e) {
        if (state.isGameOver) return;

        const hiddenInput = document.getElementById('hidden-keyboard-input');
        if (hiddenInput && state.config.useNativeKeyboard && state.isMobile) {
          e.preventDefault();
          hiddenInput.focus({ preventScroll: true });
        }
      }

      function renderBoard(rows, cols) {
        els.board.innerHTML = '';

        // Determine grid gap based on density
        const gapClass = cols > 7 ? 'gap-1' : 'gap-1.5';
        els.board.className = `flex flex-col ${gapClass} p-2 rounded-xl transition-all duration-300 items-center justify-center`;

        // Create grid structure
        for (let i = 0; i < rows; i++) {
          const row = document.createElement('div');
          row.className = `grid ${gapClass}`;
          row.id = `row-${i}`;
          // Dynamically set columns based on word length
          row.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

          for (let j = 0; j < cols; j++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.id = `tile-${i}-${j}`;

            const inner = document.createElement('div');
            inner.className = 'tile-inner';
            inner.id = `cell-${i}-${j}`;

            const front = document.createElement('div');
            front.className = 'tile-front shadow-sm';

            const back = document.createElement('div');
            back.className = 'tile-back shadow-sm';

            inner.appendChild(front);
            inner.appendChild(back);
            tile.appendChild(inner);
            row.appendChild(tile);
          }
          els.board.appendChild(row);
        }
      }

      function resizeBoard() {
        if (!els.boardContainer) return;

        const containerH = els.boardContainer.clientHeight;
        const containerW = els.boardContainer.clientWidth;
        const rows = state.maxAttempts;
        const cols = state.wordLength;

        // Gap compensation (approx pixels)
        const gap = cols > 7 ? 4 : 6;

        // Calculate max possible size based on width (cols) and height (rows)
        // Available space minus gaps
        const availableH = containerH - (rows - 1) * gap - 10; // 10px padding
        const availableW = containerW - (cols - 1) * gap - 10;

        const maxTileH = availableH / rows;
        const maxTileW = availableW / cols;

        let tileSize = Math.floor(Math.min(maxTileH, maxTileW));

        // Clamping for usability
        tileSize = Math.max(20, Math.min(tileSize, 68));

        const tiles = document.querySelectorAll('.tile');
        tiles.forEach(t => {
          t.style.width = `${tileSize}px`;
          t.style.height = `${tileSize}px`;
          // Adjust font size scaling relative to tile size
          t.style.fontSize = `${tileSize * 0.6}px`;
        });
      }

      function renderKeyboard() {
        els.keyboard.innerHTML = '';
        const rows = [
          'QWERTYUIOP'.split(''),
          'ASDFGHJKLÑ'.split(''),
          ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACK'],
        ];

        rows.forEach(rowKeys => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'flex justify-center w-full gap-1 md:gap-1.5';

          rowKeys.forEach(key => {
            const btn = document.createElement('button');
            // Base styles
            btn.className =
              'key glass-btn flex items-center justify-center rounded-md font-bold text-sm md:text-base cursor-pointer h-10 md:h-14 flex-1 select-none touch-manipulation';

            let content = key;
            if (key === 'BACK') {
              content =
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>';
              btn.classList.add('flex-[1.5]', 'max-w-[4.5rem]');
            } else if (key === 'ENTER') {
              content = 'ENTER';
              btn.classList.add(
                'flex-[1.5]',
                'text-xs',
                'font-extrabold',
                'md:text-sm',
                'max-w-[4.5rem]',
              );
            } else {
              btn.classList.add('max-w-[3rem]');
            }

            btn.innerHTML = content;
            btn.dataset.key = key;

            // Touch/Click handlers
            const pressHandler = e => {
              e.preventDefault();
              e.stopPropagation();
              handleInput(key);
            };

            btn.addEventListener('mousedown', pressHandler);
            btn.addEventListener('touchstart', pressHandler, { passive: false });

            rowDiv.appendChild(btn);
          });
          els.keyboard.appendChild(rowDiv);
        });
      }

      // --- Gameplay Logic ---

      function handleInput(key) {
        if (state.isGameOver || state.isAnimating) return;

        if (key === 'ENTER') {
          submitGuess();
        } else if (key === 'BACK' || key === 'BACKSPACE') {
          if (state.currentTile > 0) {
            state.currentTile--;
            updateCell(state.currentAttempt, state.currentTile, '');
            state.guesses[state.currentAttempt][state.currentTile] = '';
            updateActiveTileHighlight();
          }
        } else if (/^[a-zA-ZñÑ]$/.test(key)) {
          if (state.currentTile < state.wordLength) {
            const char = key.toUpperCase();
            state.guesses[state.currentAttempt][state.currentTile] = char;
            updateCell(state.currentAttempt, state.currentTile, char);
            state.currentTile++;
            updateActiveTileHighlight();
          }
        }
      }

      function updateCell(row, col, char) {
        const cell = document.getElementById(`cell-${row}-${col}`);
        if (!cell) return;

        const front = cell.querySelector('.tile-front');
        const back = cell.querySelector('.tile-back');

        front.textContent = char;
        back.textContent = char;

        if (char) {
          cell.classList.add('pop');
          setTimeout(() => cell.classList.remove('pop'), 150);
        }
      }

      function updateActiveTileHighlight() {
        // Remove active class from all tiles in current row
        for (let j = 0; j < state.wordLength; j++) {
          const t = document.getElementById(`tile-${state.currentAttempt}-${j}`);
          if (t) t.classList.remove('active');
        }

        // Add active class to current tile if valid
        if (
          !state.isGameOver &&
          !state.isAnimating &&
          state.currentTile < state.wordLength
        ) {
          const activeTile = document.getElementById(
            `tile-${state.currentAttempt}-${state.currentTile}`,
          );
          if (activeTile) {
            activeTile.classList.add('active');
          }
        }
      }

      function triggerShake(row) {
        const rowEl = document.getElementById(`row-${row}`);
        if (rowEl) {
          rowEl.classList.remove('shake');
          void rowEl.offsetWidth; // Trigger reflow
          rowEl.classList.add('shake');
        }
      }

      function submitGuess() {
        // Check word length
        if (state.currentTile < state.wordLength) {
          triggerShake(state.currentAttempt);
          return;
        }

        state.isAnimating = true;
        updateActiveTileHighlight(); // Clears highlight during animation

        const guess = state.guesses[state.currentAttempt];
        const guessWord = guess.join('');
        const target = state.targetWord.split('');

        // Calculate status
        const status = Array(state.wordLength).fill('absent');
        const targetFreq = {};
        target.forEach(l => (targetFreq[l] = (targetFreq[l] || 0) + 1));

        // First pass: Correct
        guess.forEach((l, i) => {
          if (l === target[i]) {
            status[i] = 'correct';
            targetFreq[l]--;
          }
        });

        // Second pass: Present
        guess.forEach((l, i) => {
          if (status[i] !== 'correct' && targetFreq[l] > 0) {
            status[i] = 'present';
            targetFreq[l]--;
          }
        });

        // Save cell states for current attempt
        state.cellStates[state.currentAttempt] = [...status];

        // Persist state to Genially
        genially.setState({
          guesses: state.guesses,
          cellStates: state.cellStates,
          currentAttempt: state.currentAttempt,
          keyStatus: state.keyStatus,
          isGameOver:
            guessWord === state.targetWord ||
            state.currentAttempt >= state.maxAttempts - 1,
        });

        // Animate Reveal
        guess.forEach((l, i) => {
          setTimeout(() => {
            const cell = document.getElementById(`cell-${state.currentAttempt}-${i}`);
            if (!cell) return;
            const tile = cell.parentElement;
            tile.classList.add(status[i], 'flip');
            updateKeyStatus(l, status[i]);


          }, i * 250);
        });
        // Finish even if a visual letter element has disappeared.
        setTimeout(() => finishTurn(guessWord), state.wordLength * 250);
      }

      function updateKeyStatus(letter, status) {
        const current = state.keyStatus[letter];
        if (current === 'correct') return; // Do not downgrade
        if (current === 'present' && status === 'absent') return; // Do not downgrade

        state.keyStatus[letter] = status;

        const btn = document.querySelector(`.key[data-key="${letter}"]`);
        if (btn) {
          btn.classList.remove('correct', 'present', 'absent');
          btn.classList.add(status);
        }
      }

      function finishTurn(guessWord) {
        setTimeout(() => {
          state.isAnimating = false;

          if (guessWord === state.targetWord) {
            state.isGameOver = true;
            if (state.config.onWinAction) {
              genially.runAction(state.config.onWinAction);
            }
          } else if (state.currentAttempt >= state.maxAttempts - 1) {
            state.isGameOver = true;
            if (state.config.onLoseAction) {
              genially.runAction(state.config.onLoseAction);
            }
          } else {
            state.currentAttempt++;
            state.currentTile = 0;
            updateActiveTileHighlight();
            // The board fits its container; keep all ancestor viewports stationary.
          }
        }, 300);
      }

      // --- Event Listeners ---

      document.addEventListener('keydown', e => {
        if (state.isGameOver) return;

        // Skip if hidden input has focus (it handles its own events)
        if (e.target.id === 'hidden-keyboard-input') return;

        const key = e.key.toUpperCase();
        if (key === 'ENTER') handleInput('ENTER');
        else if (key === 'BACKSPACE') handleInput('BACKSPACE');
        else if (/^[A-ZÑ]$/.test(key)) handleInput(key);
      });

      // Smart Resize
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = safeSetTimeout(() => {
          resizeBoard();
        }, 100);
      });

      // --- State Restoration ---
      function restoreState(savedState) {
        if (!savedState) return false;

        // Restore state values
        state.guesses = savedState.guesses || state.guesses;
        state.cellStates = savedState.cellStates || state.cellStates;
        state.currentAttempt = savedState.currentAttempt || 0;
        state.keyStatus = savedState.keyStatus || {};
        state.isGameOver = savedState.isGameOver || false;

        // Move to next attempt if not game over
        if (!state.isGameOver && state.cellStates[state.currentAttempt]?.[0] !== null) {
          state.currentAttempt++;
        }
        state.currentTile = 0;

        // Restore board visuals
        for (let row = 0; row < state.maxAttempts; row++) {
          for (let col = 0; col < state.wordLength; col++) {
            const letter = state.guesses[row]?.[col];
            const cellState = state.cellStates[row]?.[col];

            if (letter) {
              // Update cell content
              const cell = document.getElementById(`cell-${row}-${col}`);
              if (cell) {
                const front = cell.querySelector('.tile-front');
                const back = cell.querySelector('.tile-back');
                front.textContent = letter;
                back.textContent = letter;
              }

              // Apply flip and state class if cell was evaluated
              if (cellState) {
                const tile = document.getElementById(`tile-${row}-${col}`);
                if (tile) {
                  tile.classList.add(cellState, 'flip');
                }
              }
            }
          }
        }

        // Restore keyboard colors
        Object.entries(state.keyStatus).forEach(([letter, status]) => {
          const btn = document.querySelector(`.key[data-key="${letter}"]`);
          if (btn) {
            btn.classList.remove('correct', 'present', 'absent');
            btn.classList.add(status);
          }
        });

        updateActiveTileHighlight();
        return true;
      }

      // --- Genially Connection ---
      (async () => {
        const initialConfig = await genially.connect();

        async function render(config) {
          state.config = config;
          els.title.textContent = config.gameTitle || '';

          updateThemeFromConfig(config);
          initGame(config);

          // Try to restore saved state
          const savedState = await genially.getState();
          if (savedState) {
            restoreState(savedState);
          }
        }

        genially.on('config', render);
        await render(initialConfig);
      })();
    </script>
  </body>
</html>
